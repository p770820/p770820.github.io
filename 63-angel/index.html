<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>63第三次公演 IG 連結</title>
  <style>
    :root {
      color-scheme: light;
      --bg: #f7f2ee;
      --panel: #ffffff;
      --text: #201a1e;
      --muted: #6f626a;
      --line: #e7dce2;
      --accent: #cf2e75;
      --accent-dark: #8f2357;
      --gold: #c8962c;
      --shadow: 0 14px 36px rgba(70, 43, 56, 0.12);
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: "Noto Sans TC", "Microsoft JhengHei", "PingFang TC", Arial, sans-serif;
      background:
        radial-gradient(circle at top left, rgba(207, 46, 117, 0.16), transparent 34rem),
        linear-gradient(135deg, #fbf8f5 0%, var(--bg) 48%, #f4eef6 100%);
      color: var(--text);
      min-height: 100vh;
    }

    a {
      color: inherit;
    }

    .page {
      width: min(1120px, calc(100% - 32px));
      margin: 0 auto;
      padding: 48px 0 56px;
    }

    header {
      display: grid;
      gap: 18px;
      margin-bottom: 30px;
    }

    .eyebrow {
      color: var(--accent-dark);
      font-size: 0.86rem;
      font-weight: 700;
      letter-spacing: 0;
      margin: 0;
    }

    h1 {
      font-size: clamp(2rem, 5vw, 4.35rem);
      line-height: 1;
      margin: 0;
      letter-spacing: 0;
    }

    .summary {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      color: var(--muted);
      margin: 0;
      font-size: 0.98rem;
    }

    .summary span {
      display: inline-flex;
      align-items: center;
      min-height: 34px;
      padding: 6px 12px;
      border: 1px solid var(--line);
      border-radius: 999px;
      background: rgba(255, 255, 255, 0.72);
    }

    .toolbar {
      display: grid;
      grid-template-columns: 1fr auto;
      gap: 12px;
      align-items: center;
      margin: 30px 0;
    }

    .search {
      width: 100%;
      min-height: 46px;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: rgba(255, 255, 255, 0.9);
      color: var(--text);
      font: inherit;
      padding: 10px 14px;
      outline: none;
      box-shadow: 0 8px 22px rgba(70, 43, 56, 0.06);
    }

    .search:focus {
      border-color: var(--accent);
      box-shadow: 0 0 0 4px rgba(207, 46, 117, 0.14);
    }

    .clear {
      min-height: 46px;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: var(--panel);
      color: var(--accent-dark);
      cursor: pointer;
      font: inherit;
      font-weight: 700;
      padding: 0 16px;
    }

    main {
      display: grid;
      gap: 28px;
    }

    section {
      padding-top: 2px;
    }

    .section-head {
      display: flex;
      align-items: end;
      justify-content: space-between;
      gap: 16px;
      border-bottom: 1px solid var(--line);
      margin-bottom: 14px;
      padding-bottom: 10px;
    }

    h2 {
      font-size: clamp(1.25rem, 2vw, 1.75rem);
      margin: 0;
      letter-spacing: 0;
    }

    .count {
      color: var(--muted);
      font-size: 0.92rem;
      white-space: nowrap;
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
      gap: 12px;
    }

    .person {
      display: grid;
      gap: 10px;
      min-height: 118px;
      padding: 14px;
      border: 1px solid rgba(231, 220, 226, 0.95);
      border-radius: 8px;
      background: rgba(255, 255, 255, 0.9);
      box-shadow: var(--shadow);
    }

    .name {
      display: flex;
      align-items: center;
      gap: 10px;
      min-width: 0;
      font-weight: 800;
      font-size: 1.06rem;
    }

    .avatar {
      display: inline-grid;
      place-items: center;
      flex: 0 0 34px;
      width: 34px;
      height: 34px;
      border-radius: 50%;
      background: linear-gradient(135deg, var(--accent), var(--gold));
      color: #fff;
      font-size: 0.9rem;
      font-weight: 800;
      text-transform: uppercase;
    }

    .name span:last-child {
      overflow-wrap: anywhere;
    }

    .links {
      display: grid;
      gap: 8px;
    }

    .ig {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      min-height: 40px;
      width: 100%;
      border-radius: 8px;
      background: #201a1e;
      color: #fff;
      font-size: 0.93rem;
      font-weight: 800;
      line-height: 1.2;
      padding: 9px 12px;
      text-decoration: none;
      overflow-wrap: anywhere;
    }

    .ig::before {
      content: "";
      flex: 0 0 16px;
      width: 16px;
      height: 16px;
      border: 2px solid currentColor;
      border-radius: 5px;
      box-shadow: inset 0 0 0 3px #201a1e;
    }

    .ig:hover,
    .ig:focus-visible {
      background: var(--accent-dark);
    }

    .hidden {
      display: none;
    }

    .empty {
      display: none;
      padding: 28px;
      border: 1px dashed var(--line);
      border-radius: 8px;
      background: rgba(255, 255, 255, 0.66);
      color: var(--muted);
      text-align: center;
    }

    .empty.show {
      display: block;
    }

    footer {
      color: var(--muted);
      font-size: 0.88rem;
      margin-top: 34px;
    }

    @media (max-width: 640px) {
      .page {
        width: min(100% - 20px, 1120px);
        padding-top: 28px;
      }

      .toolbar {
        grid-template-columns: 1fr;
      }

      .clear {
        width: 100%;
      }

      .grid {
        grid-template-columns: 1fr;
      }
    }
  </style>
</head>
<body>

    </header>

    <div class="toolbar">
      <input class="search" id="search" type="search" placeholder="搜尋名字或 IG 帳號" autocomplete="off">
      <button class="clear" id="clear" type="button">清除</button>
    </div>

    <main id="content"></main>
    <p class="empty" id="empty">沒有符合的項目</p>

    <footer>Source: 63第三次公演.txt</footer>
  </div>

      },
      {
        title: "女粉",
        people: [
          ["sakurawillbloom", ["https://www.instagram.com/sakurawillbloom/"]],

          ["chao_2m", ["https://www.instagram.com/chao_2m/"]],
          ["happy44558p", ["https://www.instagram.com/happy44558p/"]],
          ["k589536", ["https://www.instagram.com/k589536/"]],
          ["jun69._", ["https://www.instagram.com/jun69._/"]],
          ["chene_mi", ["https://www.instagram.com/chene_mi/"]]
        ]
      }
    ];

    const content = document.querySelector("#content");
    const search = document.querySelector("#search");
    const clear = document.querySelector("#clear");
    const empty = document.querySelector("#empty");
    const totalCount = document.querySelector("#total-count");

    function getHandle(url) {
      const path = new URL(url).pathname.replace(/^\/|\/$/g, "");
      return path || url;
    }

    function makeInitial(name) {
      const trimmed = name.trim();
      return trimmed ? trimmed.slice(0, 1) : "@";
    }

    function render() {
      const query = search.value.trim().toLowerCase();
      let visiblePeople = 0;
      let linkTotal = 0;
      content.innerHTML = "";

      groups.forEach((group) => {
        const matches = group.people.filter(([name, links]) => {
          linkTotal += links.length;
          const text = `${name} ${links.map(getHandle).join(" ")}`.toLowerCase();
          return !query || text.includes(query);
        });

        if (!matches.length) return;
        visiblePeople += matches.length;

        const section = document.createElement("section");
        section.innerHTML = `
          <div class="section-head">
            <h2>${group.title}</h2>
            <span class="count">${matches.length} 筆</span>
          </div>
          <div class="grid"></div>
        `;

        const grid = section.querySelector(".grid");
        matches.forEach(([name, links]) => {
          const article = document.createElement("article");
          article.className = "person";
          article.innerHTML = `
            <div class="name">
              <span class="avatar">${makeInitial(name)}</span>
              <span>${name}</span>
            </div>
            <div class="links"></div>
          `;

          const linksBox = article.querySelector(".links");
          links.forEach((url) => {
            const anchor = document.createElement("a");
            anchor.className = "ig";
            anchor.href = url;
            anchor.target = "_blank";
            anchor.rel = "noopener noreferrer";
            anchor.textContent = `@${getHandle(url)}`;
            linksBox.append(anchor);
          });

          grid.append(article);
        });

        content.append(section);
      });

      totalCount.textContent = `${linkTotal} 個 IG 連結`;
      empty.classList.toggle("show", visiblePeople === 0);
    }

    search.addEventListener("input", render);
    clear.addEventListener("click", () => {
      search.value = "";
      search.focus();
      render();
    });

    render();
  </script>

</html>
