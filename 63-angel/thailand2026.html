<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="63ANGEL Thailand 2026 舞者與工作人員 Instagram 快速連結">
  <title>63ANGEL Thailand 2026｜IG 快速連結</title>
  <style>
    :root {
      color-scheme: light;
      --navy: #182b55;
      --navy-dark: #101d3b;
      --red: #a51931;
      --gold: #d7a534;
      --cream: #fffaf0;
      --panel: rgba(255, 255, 255, 0.94);
      --text: #17213a;
      --muted: #697087;
      --line: #e8dfd3;
      --shadow: 0 12px 30px rgba(24, 43, 85, 0.12);
    }

    * { box-sizing: border-box; }

    body {
      min-height: 100vh;
      margin: 0;
      color: var(--text);
      font-family: "Noto Sans TC", "Microsoft JhengHei", "PingFang TC", Arial, sans-serif;
      background:
        radial-gradient(circle at 8% 0%, rgba(215, 165, 52, 0.22), transparent 30rem),
        radial-gradient(circle at 94% 12%, rgba(165, 25, 49, 0.14), transparent 26rem),
        linear-gradient(145deg, #fffdf8, var(--cream));
    }

    button,
    input { font: inherit; }

    .page {
      width: min(1120px, calc(100% - 32px));
      margin: 0 auto;
      padding: 46px 0 56px;
    }

    header {
      position: relative;
      overflow: hidden;
      padding: clamp(24px, 5vw, 50px);
      border-radius: 20px;
      color: #fff;
      background: linear-gradient(135deg, var(--navy-dark), var(--navy) 62%, #243d73);
      box-shadow: var(--shadow);
    }

    header::after {
      position: absolute;
      right: -55px;
      bottom: -78px;
      width: 230px;
      height: 230px;
      border: 28px solid rgba(215, 165, 52, 0.18);
      border-radius: 50%;
      content: "";
    }

    .eyebrow {
      margin: 0 0 12px;
      color: #f3ca70;
      font-size: 0.8rem;
      font-weight: 800;
      letter-spacing: 0.15em;
      text-transform: uppercase;
    }

    h1 {
      position: relative;
      z-index: 1;
      max-width: 820px;
      margin: 0;
      font-size: clamp(2rem, 6vw, 4.4rem);
      line-height: 1.03;
      letter-spacing: -0.035em;
    }

    .summary {
      position: relative;
      z-index: 1;
      display: flex;
      flex-wrap: wrap;
      gap: 9px;
      margin: 22px 0 0;
    }

    .summary span {
      min-height: 32px;
      padding: 6px 11px;
      border: 1px solid rgba(255, 255, 255, 0.2);
      border-radius: 999px;
      color: #eff3ff;
      background: rgba(255, 255, 255, 0.09);
      font-size: 0.9rem;
    }

    .toolbar {
      position: sticky;
      z-index: 5;
      top: 0;
      display: grid;
      grid-template-columns: 1fr auto;
      gap: 10px;
      margin: 24px 0 30px;
      padding: 10px 0;
      background: rgba(255, 250, 240, 0.88);
      backdrop-filter: blur(12px);
    }

    .search,
    .clear {
      min-height: 48px;
      border: 1px solid var(--line);
      border-radius: 12px;
      box-shadow: 0 6px 18px rgba(24, 43, 85, 0.07);
    }

    .search {
      width: 100%;
      padding: 10px 15px;
      outline: none;
      color: var(--text);
      background: rgba(255, 255, 255, 0.96);
    }

    .search:focus {
      border-color: var(--gold);
      box-shadow: 0 0 0 4px rgba(215, 165, 52, 0.18);
    }

    .clear {
      padding: 0 18px;
      color: #fff;
      background: var(--red);
      border-color: var(--red);
      font-weight: 800;
      cursor: pointer;
    }

    .clear:hover,
    .clear:focus-visible { background: #821326; }

    main { display: grid; gap: 34px; }

    .section-head {
      display: flex;
      align-items: end;
      justify-content: space-between;
      gap: 16px;
      margin-bottom: 14px;
      padding-bottom: 10px;
      border-bottom: 2px solid var(--navy);
    }

    h2 {
      margin: 0;
      font-size: clamp(1.3rem, 2.5vw, 1.8rem);
    }

    .count {
      color: var(--muted);
      font-size: 0.9rem;
      white-space: nowrap;
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
      gap: 12px;
    }

    .person {
      display: grid;
      align-content: space-between;
      gap: 12px;
      min-height: 120px;
      padding: 15px;
      border: 1px solid var(--line);
      border-radius: 14px;
      background: var(--panel);
      box-shadow: var(--shadow);
    }

    .name {
      display: flex;
      align-items: center;
      gap: 10px;
      min-width: 0;
      font-size: 1.06rem;
      font-weight: 900;
    }

    .avatar {
      display: inline-grid;
      place-items: center;
      flex: 0 0 36px;
      width: 36px;
      height: 36px;
      border-radius: 50%;
      color: #fff;
      background: linear-gradient(135deg, var(--red), #d84b61 55%, var(--gold));
      font-size: 0.9rem;
      text-transform: uppercase;
    }

    .links { display: grid; gap: 8px; }

    .ig {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      min-height: 42px;
      width: 100%;
      padding: 9px 12px;
      border-radius: 10px;
      color: #fff;
      background: var(--navy);
      font-size: 0.92rem;
      font-weight: 800;
      line-height: 1.2;
      overflow-wrap: anywhere;
      text-decoration: none;
      transition: transform 120ms ease, background 120ms ease;
    }

    .ig::before {
      flex: 0 0 16px;
      width: 16px;
      height: 16px;
      border: 2px solid currentColor;
      border-radius: 5px;
      box-shadow: inset 0 0 0 3px var(--navy);
      content: "";
    }

    .ig:hover,
    .ig:focus-visible {
      background: var(--red);
      transform: translateY(-1px);
    }

    .ig:hover::before,
    .ig:focus-visible::before { box-shadow: inset 0 0 0 3px var(--red); }

    .empty {
      display: none;
      margin: 0;
      padding: 32px;
      border: 1px dashed var(--line);
      border-radius: 14px;
      color: var(--muted);
      background: rgba(255, 255, 255, 0.66);
      text-align: center;
    }

    .empty.show { display: block; }

    .manager {
      margin: 0 0 30px;
      border: 1px solid var(--line);
      border-radius: 14px;
      background: rgba(255, 255, 255, 0.82);
      box-shadow: var(--shadow);
    }

    .manager summary {
      padding: 16px 18px;
      color: var(--navy);
      font-weight: 900;
      cursor: pointer;
    }

    .manager-body {
      display: grid;
      gap: 16px;
      padding: 0 18px 18px;
      border-top: 1px solid var(--line);
    }

    .manager-note {
      margin: 16px 0 0;
      color: var(--muted);
      font-size: 0.9rem;
    }

    .account-form {
      display: grid;
      grid-template-columns: minmax(0, 1fr) minmax(0, 1.5fr);
      gap: 12px;
    }

    .field {
      display: grid;
      gap: 7px;
      color: var(--navy);
      font-size: 0.88rem;
      font-weight: 800;
    }

    .field input {
      min-height: 44px;
      width: 100%;
      padding: 9px 12px;
      border: 1px solid var(--line);
      border-radius: 10px;
      color: var(--text);
      background: #fff;
      outline: none;
    }

    .field input:focus {
      border-color: var(--gold);
      box-shadow: 0 0 0 3px rgba(215, 165, 52, 0.16);
    }

    .form-buttons,
    .backup-buttons,
    .card-actions {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
    }

    .form-buttons { grid-column: 1 / -1; }

    .manage-button {
      min-height: 40px;
      padding: 8px 13px;
      border: 1px solid var(--line);
      border-radius: 9px;
      color: var(--navy);
      background: #fff;
      font-weight: 800;
      cursor: pointer;
    }

    .manage-button.primary {
      color: #fff;
      border-color: var(--navy);
      background: var(--navy);
    }

    .manage-button.danger { color: var(--red); }

    .form-message {
      min-height: 1.3em;
      margin: 0;
      color: #21633b;
      font-size: 0.9rem;
      font-weight: 700;
    }

    .form-message.error { color: var(--red); }
    .file-input { display: none; }

    .ig.visited {
      color: #d5d9e4;
      background: #687086;
    }

    .ig.visited::before { box-shadow: inset 0 0 0 3px #687086; }

    .card-actions { margin-top: -3px; }

    .card-actions .manage-button {
      flex: 1;
      min-height: 36px;
      padding: 6px 10px;
      font-size: 0.84rem;
    }

    footer {
      margin-top: 34px;
      color: var(--muted);
      font-size: 0.85rem;
      text-align: center;
    }

    @media (max-width: 640px) {
      .page {
        width: min(100% - 20px, 1120px);
        padding-top: 10px;
      }

      header { border-radius: 0 0 18px 18px; }
      .toolbar { grid-template-columns: 1fr; }
      .clear { width: 100%; }
      .grid { grid-template-columns: 1fr; }
      .account-form { grid-template-columns: 1fr; }
    }
  </style>
</head>
<body>
  <div class="page">
    <header>
      <p class="eyebrow">63ANGEL · Thailand 2026</p>
      <h1>泰國公演<br>IG 快速連結</h1>
      <p class="summary" aria-live="polite">
        <span id="total-count">共 0 位</span>
        <span id="result-count">顯示 0 位</span>
        <span id="visited-count">已看過 0 個 IG</span>
      </p>
    </header>

    <div class="toolbar" role="search">
      <input class="search" id="search" type="search" placeholder="搜尋名字或 IG 帳號" aria-label="搜尋名字或 IG 帳號" autocomplete="off">
      <button class="clear" id="clear" type="button">清除搜尋</button>
    </div>

    <details class="manager" id="manager">
      <summary>新增或管理自訂帳號</summary>
      <div class="manager-body">
        <p class="manager-note">自訂帳號只會保存在目前的瀏覽器。建議新增後定期匯出 JSON 備份。</p>
        <form class="account-form" id="account-form">
          <label class="field">
            顯示名稱（選填）
            <input id="account-name" type="text" maxlength="100" placeholder="例如：新舞者">
          </label>
          <label class="field">
            Instagram 網址或帳號
            <input id="account-url" type="text" required placeholder="https://www.instagram.com/example/ 或 @example">
          </label>
          <div class="form-buttons">
            <button class="manage-button primary" id="save-account" type="submit">新增帳號</button>
            <button class="manage-button" id="cancel-edit" type="button" hidden>取消編輯</button>
          </div>
        </form>
        <p class="form-message" id="form-message" role="status" aria-live="polite"></p>
        <div class="backup-buttons">
          <button class="manage-button primary" id="export-all-accounts" type="button">匯出全部帳號</button>
          <button class="manage-button" id="export-custom-accounts" type="button">僅匯出自訂帳號</button>
          <button class="manage-button" id="import-accounts" type="button">匯入 JSON 備份</button>
          <input class="file-input" id="import-file" type="file" accept="application/json,.json">
        </div>
      </div>
    </details>

    <main id="content"></main>
    <p class="empty" id="empty">找不到符合的舞者或工作人員</p>

    <footer>點擊帳號會另開 Instagram，並在本次瀏覽器工作階段標示為已看過。</footer>
  </div>

  <script>
    const groups = [
      {
        title: "舞者",
        people: [
          ["ANNA", ["https://www.instagram.com/anna_spark_/"]],
          ["KANA", ["https://www.instagram.com/kana_burlesque/"]],
          ["fuyuka", ["https://www.instagram.com/fuyuka_burlesque/"]],
          ["futaba", ["https://www.instagram.com/futaba_burlesque/"]],
          ["AILI", ["https://www.instagram.com/aili_purplechan49/"]],
          ["asahi", ["https://www.instagram.com/asahi_burlesque/"]],
          ["ebi", ["https://www.instagram.com/ebi_burlesque/"]],
          ["ICHIGO", ["https://www.instagram.com/ichigo_63angel/"]],
          ["CONAN", ["https://www.instagram.com/conan_burlesque_yavay/"]],
          ["PUNI", ["https://www.instagram.com/puni_burlesque/"]],
          ["MISUZU", ["https://www.instagram.com/misuzu_burlesque/"]],
          ["RANKA", ["https://www.instagram.com/ran_pukupoko/", "https://www.instagram.com/ranka_burlesque/"]],
          ["mii", ["https://www.instagram.com/mii_churasun6/"]],
          ["MICHIRU", ["https://www.instagram.com/michiru_burlesque_yavay/"]],
          ["osuzu", ["https://www.instagram.com/osuzu_spark/"]],
          ["mitsuri", ["https://www.instagram.com/mitsuri_burlesque/"]],
          ["moka", ["https://www.instagram.com/moka_spark/"]],
          ["LILICA", ["https://www.instagram.com/lilica_spark/"]],
          ["maika", ["https://www.instagram.com/maika_burlesque/"]],
          ["rumi", ["https://www.instagram.com/rumi_burlesque/"]],
          ["remi", ["https://www.instagram.com/remi_burlesque/"]],
          ["sena", ["https://www.instagram.com/se_na.017/"]],
          ["uta", ["https://www.instagram.com/utatanee_zzz/"]],
          ["sora", ["https://www.instagram.com/sora_burlesque/"]],
          ["rina", ["https://www.instagram.com/rino_burlesquetokyo/"]],
          ["ruu", ["https://www.instagram.com/ruu_burlesque/"]],
          ["SATSUKI", ["https://www.instagram.com/satsuki_spark/"]],
          ["YUME", ["https://www.instagram.com/yume_burlesque/"]],
          ["KANAO", ["https://www.instagram.com/kanao_churasun6/"]],
          ["YUI", ["https://www.instagram.com/yui_blq/"]]
        ]
      },
      {
        title: "工作人員",
        people: [
          ["kz8", ["https://www.instagram.com/kz8_kazuya/"]],
          ["kuroto", ["https://www.instagram.com/kuroto6_burlesque/"]],
          ["ryota", ["https://www.instagram.com/ryota_burlesque/"]],
          ["ville", ["https://www.instagram.com/ville_photovideo/"]],
          ["mcman", ["https://www.instagram.com/mcman_burlesque_ppopgen/"]],
          ["miku", ["https://www.instagram.com/miku_burlesquestaff/"]],
          ["toshi", ["https://www.instagram.com/toshi_superspark/"]],
          ["台灣相關人士", ["https://www.instagram.com/izumirin0124/"]],
          ["ellenabtaiwn", ["https://www.instagram.com/ellenabtaiwn/"]]
        ]
      }
    ];

    const visitedStorageKey = "thailand2026.visited.v1";
    const customStorageKey = "thailand2026.custom-accounts.v1";
    const content = document.querySelector("#content");
    const search = document.querySelector("#search");
    const clear = document.querySelector("#clear");
    const empty = document.querySelector("#empty");
    const totalCount = document.querySelector("#total-count");
    const resultCount = document.querySelector("#result-count");
    const visitedCount = document.querySelector("#visited-count");
    const manager = document.querySelector("#manager");
    const accountForm = document.querySelector("#account-form");
    const accountName = document.querySelector("#account-name");
    const accountUrl = document.querySelector("#account-url");
    const saveAccount = document.querySelector("#save-account");
    const cancelEdit = document.querySelector("#cancel-edit");
    const formMessage = document.querySelector("#form-message");
    const exportAllAccounts = document.querySelector("#export-all-accounts");
    const exportCustomAccounts = document.querySelector("#export-custom-accounts");
    const importAccounts = document.querySelector("#import-accounts");
    const importFile = document.querySelector("#import-file");

    function getHandle(url) {
      return new URL(url).pathname.replace(/^\/+|\/+$/g, "").toLocaleLowerCase();
    }

    function normalizeInstagramInput(value) {
      let input = value.trim();
      if (!input) throw new Error("請輸入 Instagram 網址或帳號。");
      if (input.startsWith("@")) input = input.slice(1);
      if (/^[a-zA-Z0-9._]{1,30}$/.test(input)) {
        return `https://www.instagram.com/${input.toLocaleLowerCase()}/`;
      }
      if (/^(?:www\.)?instagram\.com\//i.test(input)) input = `https://${input}`;

      let parsed;
      try {
        parsed = new URL(input);
      } catch {
        throw new Error("Instagram 網址或帳號格式不正確。");
      }

      const hostname = parsed.hostname.toLocaleLowerCase();
      if (hostname !== "instagram.com" && !hostname.endsWith(".instagram.com")) {
        throw new Error("請輸入 Instagram 的網址。");
      }
      const handle = parsed.pathname.split("/").filter(Boolean)[0]?.toLocaleLowerCase() || "";
      const reserved = new Set(["accounts", "direct", "explore", "p", "reel", "reels", "stories"]);
      if (!/^[a-z0-9._]{1,30}$/.test(handle) || reserved.has(handle)) {
        throw new Error("網址中找不到有效的 Instagram 帳號。");
      }
      return `https://www.instagram.com/${handle}/`;
    }

    function makeId() {
      if (globalThis.crypto?.randomUUID) return crypto.randomUUID();
      return `${Date.now()}-${Math.random().toString(16).slice(2)}`;
    }

    const builtInHandles = new Set(
      groups.flatMap((group) => group.people.flatMap(([, links]) => links.map(getHandle)))
    );

    function getStoredVisited() {
      try {
        const stored = JSON.parse(sessionStorage.getItem(visitedStorageKey));
        return new Set(Array.isArray(stored) ? stored : []);
      } catch {
        return new Set();
      }
    }

    function getStoredCustomAccounts() {
      try {
        const stored = JSON.parse(localStorage.getItem(customStorageKey));
        if (!Array.isArray(stored)) return [];
        const seen = new Set(builtInHandles);
        const valid = [];
        stored.forEach((item) => {
          if (!item || typeof item.url !== "string") return;
          try {
            const url = normalizeInstagramInput(item.url);
            const handle = getHandle(url);
            if (seen.has(handle)) return;
            seen.add(handle);
            valid.push({
              id: typeof item.id === "string" && item.id ? item.id : makeId(),
              name: typeof item.name === "string" && item.name.trim() ? item.name.trim().slice(0, 100) : handle,
              url
            });
          } catch {
            // Ignore a malformed record without breaking the page.
          }
        });
        return valid;
      } catch {
        return [];
      }
    }

    const visited = getStoredVisited();
    const customAccounts = getStoredCustomAccounts();
    let editingId = null;

    function setMessage(message, isError = false) {
      formMessage.textContent = message;
      formMessage.classList.toggle("error", isError);
    }

    function saveVisited() {
      try {
        sessionStorage.setItem(visitedStorageKey, JSON.stringify([...visited]));
      } catch {
        // Tracking remains usable until the page is closed.
      }
    }

    function saveCustomAccounts() {
      try {
        localStorage.setItem(customStorageKey, JSON.stringify(customAccounts));
        return true;
      } catch {
        setMessage("瀏覽器無法保存資料；請先匯出備份，本次關閉頁面後資料可能遺失。", true);
        return false;
      }
    }

    function getAllGroups() {
      if (!customAccounts.length) return groups;
      return [
        ...groups,
        {
          title: "自行新增的帳號",
          people: customAccounts.map(({ name, url, id }) => [name, [url], id])
        }
      ];
    }

    function resetForm() {
      editingId = null;
      accountForm.reset();
      saveAccount.textContent = "新增帳號";
      cancelEdit.hidden = true;
    }

    function updateVisitedCount() {
      const currentHandles = new Set(
        getAllGroups().flatMap((group) => group.people.flatMap(([, links]) => links.map(getHandle)))
      );
      const count = [...visited].filter((handle) => currentHandles.has(handle)).length;
      visitedCount.textContent = `已看過 ${count} 個 IG`;
    }

    function beginEdit(id) {
      const account = customAccounts.find((item) => item.id === id);
      if (!account) return;
      editingId = id;
      accountName.value = account.name;
      accountUrl.value = account.url;
      saveAccount.textContent = "儲存修改";
      cancelEdit.hidden = false;
      manager.open = true;
      setMessage(`正在編輯 @${getHandle(account.url)}`);
      accountName.focus();
    }

    function deleteCustomAccount(id) {
      const index = customAccounts.findIndex((item) => item.id === id);
      if (index < 0) return;
      const handle = getHandle(customAccounts[index].url);
      if (!window.confirm(`確定要刪除 @${handle}？`)) return;
      customAccounts.splice(index, 1);
      visited.delete(handle);
      saveVisited();
      const saved = saveCustomAccounts();
      if (editingId === id) resetForm();
      render();
      if (saved) setMessage(`已刪除 @${handle}。`);
    }

    function makePerson(name, links, customId = null) {
      const article = document.createElement("article");
      article.className = "person";
      const nameBox = document.createElement("div");
      nameBox.className = "name";
      const avatar = document.createElement("span");
      avatar.className = "avatar";
      avatar.textContent = name.trim().slice(0, 1) || "@";
      avatar.setAttribute("aria-hidden", "true");
      const label = document.createElement("span");
      label.textContent = name;
      nameBox.append(avatar, label);

      const linksBox = document.createElement("div");
      linksBox.className = "links";
      links.forEach((url) => {
        const handle = getHandle(url);
        const anchor = document.createElement("a");
        anchor.className = "ig";
        anchor.href = url;
        anchor.target = "_blank";
        anchor.rel = "noopener noreferrer";
        anchor.textContent = `@${handle}`;
        anchor.classList.toggle("visited", visited.has(handle));
        anchor.setAttribute("aria-label", `在 Instagram 開啟 ${name}`);
        anchor.addEventListener("click", () => {
          visited.add(handle);
          anchor.classList.add("visited");
          saveVisited();
          updateVisitedCount();
        });
        linksBox.append(anchor);
      });
      article.append(nameBox, linksBox);

      if (customId) {
        const actions = document.createElement("div");
        actions.className = "card-actions";
        const editButton = document.createElement("button");
        editButton.className = "manage-button";
        editButton.type = "button";
        editButton.textContent = "編輯";
        editButton.addEventListener("click", () => beginEdit(customId));
        const deleteButton = document.createElement("button");
        deleteButton.className = "manage-button danger";
        deleteButton.type = "button";
        deleteButton.textContent = "刪除";
        deleteButton.addEventListener("click", () => deleteCustomAccount(customId));
        actions.append(editButton, deleteButton);
        article.append(actions);
      }
      return article;
    }

    function render() {
      const query = search.value.trim().toLocaleLowerCase();
      const allGroups = getAllGroups();
      const total = allGroups.reduce((sum, group) => sum + group.people.length, 0);
      let visible = 0;
      content.replaceChildren();

      allGroups.forEach((group) => {
        const matches = group.people.filter(([name, links]) => {
          const searchable = `${name} ${links.map(getHandle).join(" ")}`.toLocaleLowerCase();
          return !query || searchable.includes(query);
        });
        if (!matches.length) return;
        visible += matches.length;

        const section = document.createElement("section");
        const heading = document.createElement("div");
        heading.className = "section-head";
        const title = document.createElement("h2");
        title.textContent = group.title;
        const count = document.createElement("span");
        count.className = "count";
        count.textContent = `${matches.length} 位`;
        heading.append(title, count);
        const grid = document.createElement("div");
        grid.className = "grid";
        matches.forEach(([name, links, customId]) => grid.append(makePerson(name, links, customId)));
        section.append(heading, grid);
        content.append(section);
      });

      totalCount.textContent = `共 ${total} 位`;
      resultCount.textContent = `顯示 ${visible} 位`;
      empty.classList.toggle("show", visible === 0);
      updateVisitedCount();
    }

    function downloadAccounts(accounts, scope) {
      const backup = {
        version: 1,
        scope,
        exportedAt: new Date().toISOString(),
        accounts
      };
      const blob = new Blob([JSON.stringify(backup, null, 2)], { type: "application/json" });
      const downloadUrl = URL.createObjectURL(blob);
      const anchor = document.createElement("a");
      anchor.href = downloadUrl;
      anchor.download = `thailand2026-${scope}-accounts-${new Date().toISOString().slice(0, 10)}.json`;
      anchor.click();
      setTimeout(() => URL.revokeObjectURL(downloadUrl), 0);
      setMessage(`已匯出 ${accounts.length} 個 IG 帳號。`);
    }

    accountForm.addEventListener("submit", (event) => {
      event.preventDefault();
      setMessage("");
      let url;
      try {
        url = normalizeInstagramInput(accountUrl.value);
      } catch (error) {
        setMessage(error.message, true);
        accountUrl.focus();
        return;
      }

      const handle = getHandle(url);
      const duplicate = builtInHandles.has(handle) || customAccounts.some(
        (item) => item.id !== editingId && getHandle(item.url) === handle
      );
      if (duplicate) {
        setMessage(`@${handle} 已經在清單中。`, true);
        accountUrl.focus();
        return;
      }

      const name = accountName.value.trim().slice(0, 100) || handle;
      if (editingId) {
        const account = customAccounts.find((item) => item.id === editingId);
        if (!account) return;
        const oldHandle = getHandle(account.url);
        account.name = name;
        account.url = url;
        if (oldHandle !== handle) {
          visited.delete(oldHandle);
          saveVisited();
        }
        const saved = saveCustomAccounts();
        resetForm();
        render();
        if (saved) setMessage(`已更新 @${handle}。`);
        return;
      }

      customAccounts.push({ id: makeId(), name, url });
      const saved = saveCustomAccounts();
      resetForm();
      render();
      if (saved) setMessage(`已新增 @${handle}。`);
    });

    cancelEdit.addEventListener("click", () => {
      resetForm();
      setMessage("已取消編輯。");
    });

    exportAllAccounts.addEventListener("click", () => {
      const builtInAccounts = groups.flatMap((group) =>
        group.people.flatMap(([name, links]) =>
          links.map((url) => ({ name, url, group: group.title, source: "built-in" }))
        )
      );
      const addedAccounts = customAccounts.map(({ name, url }) => ({
        name,
        url,
        group: "自行新增的帳號",
        source: "custom"
      }));
      downloadAccounts([...builtInAccounts, ...addedAccounts], "all");
    });

    exportCustomAccounts.addEventListener("click", () => {
      if (!customAccounts.length) {
        setMessage("目前沒有可匯出的自訂帳號。", true);
        return;
      }
      downloadAccounts(customAccounts.map(({ name, url }) => ({ name, url })), "custom");
    });

    importAccounts.addEventListener("click", () => importFile.click());
    importFile.addEventListener("change", async () => {
      const file = importFile.files?.[0];
      if (!file) return;
      try {
        const parsed = JSON.parse(await file.text());
        const accounts = Array.isArray(parsed) ? parsed : parsed?.accounts;
        if (!Array.isArray(accounts)) throw new Error("備份內容格式不正確。");
        const seen = new Set([
          ...builtInHandles,
          ...customAccounts.map((item) => getHandle(item.url))
        ]);
        let added = 0;
        let skipped = 0;
        accounts.forEach((item) => {
          try {
            if (!item || typeof item.url !== "string") throw new Error();
            const url = normalizeInstagramInput(item.url);
            const handle = getHandle(url);
            if (seen.has(handle)) {
              skipped += 1;
              return;
            }
            seen.add(handle);
            customAccounts.push({
              id: makeId(),
              name: typeof item.name === "string" && item.name.trim() ? item.name.trim().slice(0, 100) : handle,
              url
            });
            added += 1;
          } catch {
            skipped += 1;
          }
        });
        const saved = saveCustomAccounts();
        render();
        if (saved) setMessage(`匯入完成：新增 ${added} 個，略過 ${skipped} 個。`);
      } catch (error) {
        setMessage(error.message || "無法讀取這份 JSON 備份。", true);
      } finally {
        importFile.value = "";
      }
    });

    search.addEventListener("input", render);
    clear.addEventListener("click", () => {
      search.value = "";
      search.focus();
      render();
    });

    render();
  </script>
</body>
</html>
